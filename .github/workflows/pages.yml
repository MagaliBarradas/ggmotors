name: Publicar site estático

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar ficheiros estáticos
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          include-hidden-files: false

      - name: Publicar site
        id: deploy
        uses: actions/deploy-pages@v4
